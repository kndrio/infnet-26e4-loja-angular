<main class="mx-auto flex max-w-6xl flex-col gap-6 p-6">
  <header class="flex flex-wrap items-end justify-between gap-4">
  <h1 class="text-3xl font-bold text-slate-900">{{titulo()}}</h1>
  <p class="text-slate-600">{{ filtrados().length}} de {{produtos().length}} produtos</p>
  </header>

  <section class="flex flex-wrap items-center gap-3" aria-label="Filtros">
    <label  class="flex flex-col text-sm text-slate-700">
      Buscar
    </label>
    <input [(ngModel)]="busca" placeholder="ex.: Café..."/>


    <div lass="flex gap-2" role="group" aria-label="Categorias">
      @for (cat of categorias; track cat){
        <button type="button" 
        class="rounded-full border px-3 py-1 text-sm" 
        (click)="categoria.set(cat)"
        >
        {{cat}}
        </button>
      }
    </div>
  </section>

<section class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3" aria-label="Produtos">
  @for (p of filtrados(); track p.id; let i = $index, primeiro = $first) {
    <article>
      <app-produto-card
      [produto]="p"

      />
    </article>
  }
</section>

</main>

<router-outlet />
